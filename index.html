<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="format-detection" content="telephone=no" />
    <title>フィットクエスト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1c2c;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* env(safe-area-inset-*) を JS から読むための不可視要素 */
      #safe-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1c2c;
        color: #f4f4f4;
        font-family: 'DotGothic16', sans-serif;
        font-size: 18px;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="safe-probe"></div>
    <div id="game"></div>
    <div id="rotate">端末を縦向きにしてください</div>
    <div id="boot-error"></div>
    <script>
      // 読み込みに失敗したとき、真っ黒な画面のままにせず原因と再読み込みボタンを出す
      (function () {
        var shown = false;
        function show(msg) {
          if (shown) return;
          shown = true;
          var el = document.getElementById('boot-error');
          el.style.cssText =
            'position:fixed;inset:0;z-index:20;background:#1a1c2c;color:#f4f4f4;padding:calc(env(safe-area-inset-top) + 24px) 20px 20px;font:14px/1.6 sans-serif;overflow:auto';
          el.innerHTML =
            '<p style="color:#ffd23f;font-size:16px">読み込み中にエラーが起きました</p>' +
            '<p style="word-break:break-all;color:#94b0c2">' + String(msg).replace(/</g, '&lt;') + '</p>' +
            '<p><button id="boot-reload" style="font-size:16px;padding:10px 16px">再読み込み（キャッシュを使わない）</button></p>';
          document.getElementById('boot-reload').onclick = function () {
            location.replace(location.pathname + '?r=' + Date.now());
          };
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'エラー') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show(e.reason && e.reason.message ? e.reason.message : String(e.reason));
        });
        setTimeout(function () {
          if (!window.__gameStarted) show('10秒たってもゲームが始まりませんでした');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
